<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBFLIX</title>
  <meta name="description" content="DBFLIX - an unofficial, fan-made, streaming-style fanpage.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER: menu on the LEFT, logo on the RIGHT -->
  <header class="site-header" id="header">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <a class="logo" id="logo" href="#/home" aria-label="Home"></a>
  </header>

  <main id="app"></main>

  <footer class="site-footer" id="footer"></footer>

  <!-- DETAILS / VIDEO POP-UP -->
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Details">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
